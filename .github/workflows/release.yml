name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# standard nur lesen, schreiben nur im release-job
permissions:
  contents: read

env:
  # muss zu INDEX_PUBLIC_KEY_HEX in src-tauri/src/main.rs passen
  INDEX_PUBLIC_KEY_HEX: 58a9b3f690eff8f58a116e4bf309491790e8e8ee60034854a0beaed067c36f97

jobs:
  build:
    runs-on: windows-latest
    steps:
      # alle actions auf commit-hash festgenagelt, nicht auf tags
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspace: src-tauri

      - name: Install verifier dependency
        run: python -m pip install --quiet cryptography

      # shim kommt nur aus der signierten liste, erst nach der signaturprüfung
      - name: Fetch the shim from the signed mod list
        run: python scripts/fetch_verified_shim.py

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri build -- --locked

      - name: Package
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          Copy-Item $setup.FullName horsey-mod-manager-setup.exe
          $hash = (Get-FileHash horsey-mod-manager-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  horsey-mod-manager-setup.exe" | Set-Content -Encoding ascii horsey-mod-manager-setup.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horsey-mod-manager
          path: |
            horsey-mod-manager-setup.exe
            horsey-mod-manager-setup.exe.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsey-mod-manager

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            horsey-mod-manager-setup.exe
            horsey-mod-manager-setup.exe.sha256
