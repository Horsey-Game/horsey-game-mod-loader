name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspace: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/horsey-mod-manager.exe horsey-mod-manager.exe
          $hash = (Get-FileHash horsey-mod-manager.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  horsey-mod-manager.exe" | Set-Content -Encoding ascii horsey-mod-manager.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: horsey-mod-manager
          path: |
            horsey-mod-manager.exe
            horsey-mod-manager.exe.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: horsey-mod-manager

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            horsey-mod-manager.exe
            horsey-mod-manager.exe.sha256
