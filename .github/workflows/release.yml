name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspace: src-tauri

      - name: Fetch the latest shim from the mod server
        shell: pwsh
        run: |
          $index = Invoke-RestMethod -Uri 'https://mods.badasswizard.boats/index.json'
          $shim = $index.shim
          Invoke-WebRequest -UseBasicParsing -Uri $shim.download_url -OutFile src-tauri/resources/version.dll
          if ((Get-Item src-tauri/resources/version.dll).Length -ne $shim.size) { throw 'shim size does not match the mod list' }
          $hash = (Get-FileHash src-tauri/resources/version.dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $shim.sha256.ToLower()) { throw 'shim checksum does not match the mod list' }

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-windows

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri build

      - name: Package
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          Copy-Item $setup.FullName horsey-mod-manager-setup.exe
          $hash = (Get-FileHash horsey-mod-manager-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  horsey-mod-manager-setup.exe" | Set-Content -Encoding ascii horsey-mod-manager-setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: horsey-mod-manager
          path: |
            horsey-mod-manager-setup.exe
            horsey-mod-manager-setup.exe.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: horsey-mod-manager

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            horsey-mod-manager-setup.exe
            horsey-mod-manager-setup.exe.sha256
